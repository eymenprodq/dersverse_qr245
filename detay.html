<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="7HO7fMJQkkZRbFemkvJ7JASrZmYOfqoAglMJqsvDW9o" />
    <title>İçerik Detayı - DersVerse</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --dersverse-bg: #0a0a12;
            --dersverse-card-bg: rgba(255, 255, 255, 0.05);
            --dersverse-border: rgba(255, 255, 255, 0.1);
            --dersverse-primary: #6366f1;
            --dersverse-primary-hover: #4f46e5;
            --dersverse-text: #f3f4f6;
            --dersverse-text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dersverse-bg);
            color: var(--dersverse-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        header.dersverse-header {
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--dersverse-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .dersverse-logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .dersverse-btn {
            background: var(--dersverse-primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .dersverse-btn:hover {
            background: var(--dersverse-primary-hover);
        }

        .dersverse-btn-outline {
            background: transparent;
            border: 1px solid var(--dersverse-border);
            color: var(--dersverse-text);
        }

        .dersverse-btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        main.dersverse-main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .dersverse-detail-card {
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .dersverse-detail-tag {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--dersverse-primary);
            text-transform: uppercase;
            font-weight: bold;
            background: rgba(99, 102, 241, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            margin-bottom: 1rem;
        }

        .dersverse-detail-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .dersverse-detail-desc {
            color: #d1d5db;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            white-space: pre-line;
        }

        .dersverse-detail-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .dersverse-not-found {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--dersverse-text-muted);
        }
    </style>
</head>
<body>

    <header class="dersverse-header">
        <a href="index.html" class="dersverse-logo">DersVerse</a>
        <a href="index.html" class="dersverse-btn dersverse-btn-outline">← Ana Sayfaya Dön</a>
    </header>

    <main class="dersverse-main">
        <div id="dersverse-detail-container">
            <p style="text-align: center; color: var(--dersverse-text-muted);">İçerik yükleniyor...</p>
        </div>
    </main>

    <!-- Tawk.to Canlı Destek Entegrasyonu -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6aaa9769d5bb1934472d59e2/1k2l5utmu';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>

    <script>
        // DersVerse - Supabase Yapılandırması
        const DERSVERSE_SUPABASE_URL = 'https://dyxghgzquvsngehjjvcb.supabase.co';
        const DERSVERSE_SUPABASE_KEY = 'sb_publishable_qgcYdZz60VDBkfLZ3UVftw_G9o30nYd'; 
        const dersverseSupabase = supabase.createClient(DERSVERSE_SUPABASE_URL, DERSVERSE_SUPABASE_KEY);

        // URL'den id Parametresini Al
        function dersverseGetContentId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // Güvenlik Kısıtlamaları (Admin Hariç Koruma)
        async function dersverseSetupProtection() {
            const { data: { user } } = await dersverseSupabase.auth.getUser();
            const isAdmin = user && user.email === 'femememe1973@gmail.com';
            if (isAdmin) return;

            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.key === 'F12' || 
                    (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) ||
                    (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key))) {
                    e.preventDefault();
                    return false;
                }
            });
        }

        // Detay İçeriğini Çekme ve Ekrana Basma
        async function dersverseLoadDetail() {
            const contentId = dersverseGetContentId();
            const container = document.getElementById('dersverse-detail-container');

            if (!contentId) {
                container.innerHTML = `
                    <div class="dersverse-not-found">
                        <h2>Geçersiz Bağlantı</h2>
                        <p style="margin-top: 0.5rem;">Lütfen geçerli bir içerik seçiniz.</p>
                        <a href="index.html" class="dersverse-btn" style="margin-top: 1.5rem;">Ana Sayfaya Dön</a>
                    </div>
                `;
                return;
            }

            const { data, error } = await dersverseSupabase
                .from('contents')
                .select('*')
                .eq('id', contentId)
                .single();

            if (error || !data) {
                container.innerHTML = `
                    <div class="dersverse-not-found">
                        <h2>İçerik Bulunamadı</h2>
                        <p style="margin-top: 0.5rem;">Aradığınız içerik kaldırılmış veya onaylanmamış olabilir.</p>
                        <a href="index.html" class="dersverse-btn" style="margin-top: 1.5rem;">Ana Sayfaya Dön</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="dersverse-detail-card">
                    <span class="dersverse-detail-tag">${data.category || 'Genel'}</span>
                    <h1 class="dersverse-detail-title">${data.title}</h1>
                    <p class="dersverse-detail-desc">${data.description}</p>
                    <div class="dersverse-detail-actions">
                        <a href="${data.link}" target="_blank" rel="noopener noreferrer" class="dersverse-btn">Materyali İncele / İndir ↗</a>
                    </div>
                </div>
            `;
        }

        window.onload = () => {
            dersverseSetupProtection();
            dersverseLoadDetail();
        };
    </script>
</body>
</html>
