<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="7HO7fMJQkkZRbFemkvJ7JASrZmYOfqoAglMJqsvDW9o" />
    <title>İçerik Detayı - DersVerse</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --dersverse-bg: #0a0a12;
            --dersverse-card-bg: rgba(255, 255, 255, 0.05);
            --dersverse-border: rgba(255, 255, 255, 0.1);
            --dersverse-primary: #6366f1;
            --dersverse-primary-hover: #4f46e5;
            --dersverse-text: #f3f4f6;
            --dersverse-text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dersverse-bg);
            color: var(--dersverse-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        header.dersverse-header {
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--dersverse-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .dersverse-logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .dersverse-btn {
            background: var(--dersverse-primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .dersverse-btn:hover {
            background: var(--dersverse-primary-hover);
        }

        .dersverse-btn-outline {
            background: transparent;
            border: 1px solid var(--dersverse-border);
            color: var(--dersverse-text);
        }

        .dersverse-btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        main.dersverse-main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            flex: 1;
        }

        .dersverse-detail-card {
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .dersverse-detail-tag {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--dersverse-primary);
            text-transform: uppercase;
            font-weight: bold;
            background: rgba(99, 102, 241, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            margin-bottom: 1rem;
        }

        .dersverse-detail-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .dersverse-detail-desc {
            color: #d1d5db;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            white-space: pre-line;
        }

        .dersverse-detail-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .dersverse-not-found {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--dersverse-text-muted);
        }

        /* Yorumlar Bölümü Stilleri */
        .dersverse-comments-section {
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 3rem;
        }

        .dersverse-comments-title {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
        }

        .dersverse-comments-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .dersverse-comment-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--dersverse-border);
            padding: 1rem;
            border-radius: 8px;
        }

        .dersverse-comment-author {
            font-size: 0.85rem;
            color: var(--dersverse-primary);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .dersverse-comment-text {
            font-size: 0.95rem;
            color: var(--dersverse-text);
            line-height: 1.4;
        }

        .dersverse-comment-form {
            display: flex;
            gap: 0.75rem;
        }

        .dersverse-comment-input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--dersverse-border);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
        }

        .dersverse-comment-input:focus {
            outline: none;
            border-color: var(--dersverse-primary);
        }
    </style>
</head>
<body>

    <header class="dersverse-header">
        <a href="index.html" class="dersverse-logo">DersVerse</a>
        <a href="index.html" class="dersverse-btn dersverse-btn-outline">← Ana Sayfaya Dön</a>
    </header>

    <main class="dersverse-main">
        <div id="dersverse-detail-container">
            <p style="text-align: center; color: var(--dersverse-text-muted);">İçerik yükleniyor...</p>
        </div>

        <!-- Yorumlar Alanı -->
        <div class="dersverse-comments-section">
            <h3 class="dersverse-comments-title">Yorumlar</h3>
            <div id="dersverse-comments-list" class="dersverse-comments-list">
                <!-- Yorumlar dinamik olarak buraya gelecek -->
            </div>
            <form id="dersverse-comment-form" onsubmit="dersverseSubmitComment(event)" class="dersverse-comment-form">
                <input type="text" id="dersverse-comment-input" required placeholder="Düşüncelerinizi paylaşın..." class="dersverse-comment-input">
                <button type="submit" class="dersverse-btn">Gönder</button>
            </form>
        </div>
    </main>

    <!-- Tawk.to Canlı Destek Entegrasyonu -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6aaa9769d5bb1934472d59e2/1k2l5utmu';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>

    <script>
        // DersVerse - Supabase Yapılandırması
        const DERSVERSE_SUPABASE_URL = 'https://dyxghgzquvsngehjjvcb.supabase.co';
        const DERSVERSE_SUPABASE_KEY = 'sb_publishable_qgcYdZz60VDBkfLZ3UVftw_G9o30nYd'; 
        const dersverseSupabase = supabase.createClient(DERSVERSE_SUPABASE_URL, DERSVERSE_SUPABASE_KEY);

        // URL'den id Parametresini Al
        function dersverseGetContentId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // Güvenlik Kısıtlamaları (Admin Hariç Koruma)
        async function dersverseSetupProtection() {
            const { data: { user } } = await dersverseSupabase.auth.getUser();
            const isAdmin = user && user.email === 'femememe1973@gmail.com';
            if (isAdmin) return;

            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.key === 'F12' || 
                    (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) ||
                    (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key))) {
                    e.preventDefault();
                    return false;
                }
            });
        }

        // Detay İçeriğini Çekme ve Ekrana Basma
        async function dersverseLoadDetail() {
            const contentId = dersverseGetContentId();
            const container = document.getElementById('dersverse-detail-container');

            if (!contentId) {
                container.innerHTML = `
                    <div class="dersverse-not-found">
                        <h2>Geçersiz Bağlantı</h2>
                        <p style="margin-top: 0.5rem;">Lütfen geçerli bir içerik seçiniz.</p>
                        <a href="index.html" class="dersverse-btn" style="margin-top: 1.5rem;">Ana Sayfaya Dön</a>
                    </div>
                `;
                return;
            }

            const { data, error } = await dersverseSupabase
                .from('contents')
                .select('*')
                .eq('id', contentId)
                .single();

            if (error || !data) {
                container.innerHTML = `
                    <div class="dersverse-not-found">
                        <h2>İçerik Bulunamadı</h2>
                        <p style="margin-top: 0.5rem;">Aradığınız içerik kaldırılmış veya onaylanmamış olabilir.</p>
                        <a href="index.html" class="dersverse-btn" style="margin-top: 1.5rem;">Ana Sayfaya Dön</a>
                    </div>
                `;
                return;
            }

            const isTeacher = data.is_teacher || false;
            const authorName = escapeHtml(data.user_name || 'Kullanıcı');

            container.innerHTML = `
                <div class="dersverse-detail-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                        <span class="dersverse-detail-tag" style="margin-bottom:0;">${escapeHtml(data.category || 'Genel')}</span>
                        ${isTeacher ? '<span style="font-size: 0.8rem; background: rgba(99,102,241,0.2); color: #818cf8; padding: 4px 10px; border-radius: 12px; border: 1px solid #6366f1;">✔ Doğrulanmış Öğretmen</span>' : ''}
                    </div>
                    <h1 class="dersverse-detail-title">${escapeHtml(data.title)}</h1>
                    <p class="dersverse-detail-desc">${escapeHtml(data.description)}</p>
                    <p style="font-size: 0.85rem; color: var(--dersverse-text-muted); margin-bottom: 1.5rem;">Paylaşan: ${authorName}</p>
                    <div class="dersverse-detail-actions">
                        ${data.link ? `<a href="${escapeHtml(data.link)}" target="_blank" rel="noopener noreferrer" class="dersverse-btn">Materyali İncele / İndir ↗</a>` : ''}
                    </div>
                </div>
            `;
        }

        // Yorumları Yükleme
        async function dersverseLoadComments() {
            const contentId = dersverseGetContentId();
            if (!contentId) return;

            const { data, error } = await dersverseSupabase
                .from('comments')
                .select('*')
                .eq('content_id', contentId)
                .order('created_at', { ascending: false });

            const listDiv = document.getElementById('dersverse-comments-list');
            if (!data || data.length === 0) {
                listDiv.innerHTML = '<p style="color: var(--dersverse-text-muted); font-size: 0.95rem;">Henüz yorum yapılmamış. İlk yorumu siz yazın!</p>';
                return;
            }

            listDiv.innerHTML = data.map(c => `
                <div class="dersverse-comment-item">
                    <div class="dersverse-comment-author">${escapeHtml(c.user_email ? c.user_email.split('@')[0] : 'Kullanıcı')}</div>
                    <div class="dersverse-comment-text">${escapeHtml(c.comment)}</div>
                </div>
            `).join('');
        }

        // Yorum Gönderme
        async function dersverseSubmitComment(e) {
            e.preventDefault();
            const contentId = dersverseGetContentId();
            const { data: { user } } = await dersverseSupabase.auth.getUser();
            
            if (!user) {
                alert('Yorum yapabilmek için giriş yapmalısınız.');
                window.location.href = 'login.html';
                return;
            }

            const commentText = document.getElementById('dersverse-comment-input').value;
            const { error } = await dersverseSupabase.from('comments').insert([{
                content_id: contentId,
                user_id: user.id,
                user_email: user.email,
                comment: commentText
            }]);

            if (error) {
                alert('Yorum gönderilemedi: ' + error.message);
            } else {
                document.getElementById('dersverse-comment-input').value = '';
                dersverseLoadComments();
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = () => {
            dersverseSetupProtection();
            dersverseLoadDetail();
            dersverseLoadComments();
        };
    </script>
</body>
</html>
