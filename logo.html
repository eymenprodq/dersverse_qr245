<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DersVerse - Logo Yönetim Alanı</title>
    <style>
        :root {
            --dersverse-bg: #0a0a12;
            --dersverse-card-bg: rgba(255, 255, 255, 0.05);
            --dersverse-border: rgba(255, 255, 255, 0.1);
            --dersverse-primary: #6366f1;
            --dersverse-primary-hover: #4f46e5;
            --dersverse-text: #f3f4f6;
            --dersverse-text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dersverse-bg);
            color: var(--dersverse-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .logo-container {
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--dersverse-text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .logo-preview {
            width: 200px;
            height: 200px;
            margin: 0 auto 1.5rem auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 1px solid var(--dersverse-border);
        }

        .logo-preview svg {
            width: 100%;
            height: 100%;
        }

        .btn {
            background: var(--dersverse-primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            margin-bottom: 0.8rem;
        }

        .btn:hover {
            background: var(--dersverse-primary-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--dersverse-border);
            color: var(--dersverse-text);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <h1>DersVerse Logo Merkezi</h1>
        <p>APK ve Web için resmi uygulama simgesi</p>

        <div class="logo-preview">
            <!-- 512x512 Logo Grafiği -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
              <defs>
                <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0a0a12" />
                  <stop offset="100%" stop-color="#16162c" />
                </linearGradient>
                <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#6366f1" />
                  <stop offset="100%" stop-color="#a855f7" />
                </linearGradient>
              </defs>
              <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />
              <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
              <g>
                <path d="M 256 130 C 210 130, 140 150, 110 170 L 110 360 C 140 340, 210 320, 256 320 Z" fill="url(#primaryGradient)" opacity="0.85" />
                <path d="M 256 130 C 302 130, 372 150, 402 170 L 402 360 C 372 340, 302 320, 256 320 Z" fill="url(#primaryGradient)" />
                <line x1="256" y1="130" x2="256" y2="320" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
                <path d="M 256 75 L 268 105 L 298 117 L 268 129 L 256 159 L 244 129 L 214 117 L 244 105 Z" fill="#38bdf8" />
              </g>
              <text x="256" y="420" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">DERSVERSE</text>
            </svg>
        </div>

        <button class="btn" onclick="downloadPNG()">512x512 PNG İndir</button>
        <a href="index.html" class="btn btn-outline">Ana Sayfaya Dön</a>
    </div>

    <script>
        function downloadPNG() {
            const svgElement = document.querySelector('.logo-preview svg');
            const svgString = new XMLSerializer().serializeToString(svgElement);
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const URL = window.URL || window.webkitURL || window;
            const blobURL = URL.createObjectURL(svgBlob);

            const image = new Image();
            image.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const context = canvas.getContext('2d');
                context.drawImage(image, 0, 0, 512, 512);

                const pngURI = canvas.toDataURL('image/png').replace('image/png', 'image/octet-stream');
                const downloadLink = document.createElement('a');
                downloadLink.href = pngURI;
                downloadLink.download = 'dersverse-logo-512x512.png';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            };
            image.src = blobURL;
        }
    </script>
</body>
</html>
