<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="7HO7fMJQkkZRbFemkvJ7JASrZmYOfqoAglMJqsvDW9o" />
    <title>DersVerse - Admin Yönetim Paneli</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --dersverse-bg: #0a0a12;
            --dersverse-card-bg: rgba(255, 255, 255, 0.05);
            --dersverse-border: rgba(255, 255, 255, 0.1);
            --dersverse-primary: #6366f1;
            --dersverse-primary-hover: #4f46e5;
            --dersverse-success: #10b981;
            --dersverse-danger: #ef4444;
            --dersverse-warning: #f59e0b;
            --dersverse-text: #f3f4f6;
            --dersverse-text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dersverse-bg);
            color: var(--dersverse-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Menü */
        header.admin-header {
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--dersverse-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .admin-badge {
            background: rgba(239, 68, 68, 0.2);
            color: var(--dersverse-danger);
            border: 1px solid rgba(239, 68, 68, 0.4);
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .admin-nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background: var(--dersverse-primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover { background: var(--dersverse-primary-hover); }
        .btn-success { background: var(--dersverse-success); }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: var(--dersverse-danger); }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--dersverse-border);
            color: var(--dersverse-text);
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.1); }

        /* Ana Gövde */
        main.admin-container {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        /* İstatistik Kartları */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-info h4 {
            color: var(--dersverse-text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .stat-info div {
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-icon {
            font-size: 2.5rem;
            opacity: 0.8;
        }

        /* Sekmeler */
        .admin-tabs {
            display: flex;
            gap: 1rem;
            border-bottom: 1px solid var(--dersverse-border);
            margin-bottom: 2rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--dersverse-text-muted);
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--dersverse-primary);
            border-bottom-color: var(--dersverse-primary);
        }

        /* İçerik Tablosu */
        .table-responsive {
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--dersverse-border);
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--dersverse-text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        tr:last-child td { border-bottom: none; }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-pending { background: rgba(245, 158, 11, 0.2); color: var(--dersverse-warning); }
        .status-approved { background: rgba(16, 185, 129, 0.2); color: var(--dersverse-success); }
        .status-rejected { background: rgba(239, 68, 68, 0.2); color: var(--dersverse-danger); }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .action-btns button {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        /* Yetkisiz Erişim Ekranı */
        #unauthorized-screen {
            display: none;
            text-align: center;
            padding: 5rem 1rem;
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <a href="index.html" class="admin-logo">
            DersVerse
            <span class="admin-badge">Admin Paneli</span>
        </a>
        <div class="admin-nav-actions">
            <span id="admin-email-display" style="color: var(--dersverse-text-muted); font-size: 0.9rem;"></span>
            <a href="index.html" class="btn btn-outline">← Siteme Dön</a>
        </div>
    </header>

    <!-- Yetkisiz Erişim Engeli -->
    <div id="unauthorized-screen">
        <h1 style="font-size: 3rem; color: var(--dersverse-danger); margin-bottom: 1rem;">403 - Erişim Engellendi</h1>
        <p style="color: var(--dersverse-text-muted); font-size: 1.2rem; margin-bottom: 2rem;">Bu yönetim paneline sadece yetkili yönetici erişebilir.</p>
        <a href="index.html" class="btn">Ana Sayfaya Dön</a>
    </div>

    <!-- Admin Yönetim Ekranı -->
    <main class="admin-container" id="admin-main-screen">

        <!-- İstatistik Bölümü -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <h4>Onay Bekleyenler</h4>
                    <div id="stat-pending-count" style="color: var(--dersverse-warning);">0</div>
                </div>
                <div class="stat-icon">⏳</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h4>Yayınlanan İçerikler</h4>
                    <div id="stat-approved-count" style="color: var(--dersverse-success);">0</div>
                </div>
                <div class="stat-icon">✅</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h4>Reddedilenler</h4>
                    <div id="stat-rejected-count" style="color: var(--dersverse-danger);">0</div>
                </div>
                <div class="stat-icon">❌</div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h4>Toplam İçerik</h4>
                    <div id="stat-total-count" style="color: var(--dersverse-primary);">0</div>
                </div>
                <div class="stat-icon">📚</div>
            </div>
        </section>

        <!-- Sekme Sistemi -->
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="filterTable('pending', this)">Onay Bekleyenler</button>
            <button class="tab-btn" onclick="filterTable('approved', this)">Yayınlananlar</button>
            <button class="tab-btn" onclick="filterTable('rejected', this)">Reddedilenler</button>
            <button class="tab-btn" onclick="filterTable('all', this)">Tüm İçerikler</button>
        </div>

        <!-- Yönetim Tablosu -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Başlık</th>
                        <th>Kategori</th>
                        <th>Açıklama</th>
                        <th>Bağlantı</th>
                        <th>Durum</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--dersverse-text-muted); padding: 2rem;">İçerikler yükleniyor...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <!-- Tawk.to Canlı Destek Entegrasyonu -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6aaa9769d5bb1934472d59e2/1k2l5utmu';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>

    <script>
        // Supabase Bağlantısı
        const DERSVERSE_SUPABASE_URL = 'https://dyxghgzquvsngehjjvcb.supabase.co';
        const DERSVERSE_SUPABASE_KEY = 'sb_publishable_qgcYdZz60VDBkfLZ3UVftw_G9o30nYd'; 
        const dersverseSupabase = supabase.createClient(DERSVERSE_SUPABASE_URL, DERSVERSE_SUPABASE_KEY);

        let allContents = [];
        let currentFilter = 'pending';

        // Yönetici Oturum ve Yetki Kontrolü
        async function checkAdminAuth() {
            const { data: { user } } = await dersverseSupabase.auth.getUser();

            if (!user || user.email !== 'femememe1973@gmail.com') {
                document.getElementById('admin-main-screen').style.display = 'none';
                document.getElementById('unauthorized-screen').style.display = 'block';
                return false;
            }

            document.getElementById('admin-email-display').innerText = user.email;
            return true;
        }

        // Verileri Çekme ve İstatistikleri Hesaplama
        async function loadAdminData() {
            const { data, error } = await dersverseSupabase
                .from('contents')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                alert('Veriler çekilirken hata oluştu: ' + error.message);
                return;
            }

            allContents = data || [];
            updateStats();
            renderTable();
        }

        // İstatistik Kartlarını Güncelleme
        function updateStats() {
            const pending = allContents.filter(i => i.status === 'pending').length;
            const approved = allContents.filter(i => i.status === 'approved').length;
            const rejected = allContents.filter(i => i.status === 'rejected').length;

            document.getElementById('stat-pending-count').innerText = pending;
            document.getElementById('stat-approved-count').innerText = approved;
            document.getElementById('stat-rejected-count').innerText = rejected;
            document.getElementById('stat-total-count').innerText = allContents.length;
        }

        // Tabloyu Filtreleme ve Basma
        function renderTable() {
            const tbody = document.getElementById('admin-table-body');
            let filtered = allContents;

            if (currentFilter !== 'all') {
                filtered = allContents.filter(item => item.status === currentFilter);
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--dersverse-text-muted); padding: 2rem;">Bu filtrede içerik bulunmuyor.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(item => `
                <tr>
                    <td style="font-weight: 600;">${item.title}</td>
                    <td><span style="color: var(--dersverse-primary);">${item.category || 'Genel'}</span></td>
                    <td style="color: var(--dersverse-text-muted); max-width: 250px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">${item.description}</td>
                    <td><a href="${item.link}" target="_blank" style="color: #60a5fa; text-decoration: none;">Linke Git ↗</a></td>
                    <td><span class="status-badge status-${item.status}">${getStatusText(item.status)}</span></td>
                    <td>
                        <div class="action-btns">
                            ${item.status !== 'approved' ? `<button class="btn btn-success" onclick="updateStatus('${item.id}', 'approved')">Onayla</button>` : ''}
                            ${item.status !== 'rejected' ? `<button class="btn btn-outline" onclick="updateStatus('${item.id}', 'rejected')" style="color: var(--dersverse-warning);">Reddet</button>` : ''}
                            <button class="btn btn-danger" onclick="deleteContent('${item.id}')">Sil</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function getStatusText(status) {
            if (status === 'approved') return 'Yayınlandı';
            if (status === 'rejected') return 'Reddedildi';
            return 'Bekliyor';
        }

        function filterTable(status, element) {
            currentFilter = status;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            renderTable();
        }

        // İçerik Durumunu Güncelleme (Onayla / Reddet)
        async function updateStatus(id, newStatus) {
            const { error } = await dersverseSupabase
                .from('contents')
                .update({ status: newStatus })
                .eq('id', id);

            if (error) {
                alert('İşlem başarısız: ' + error.message);
            } else {
                loadAdminData();
            }
        }

        // İçerik Silme
        async function deleteContent(id) {
            if (!confirm('Bu içeriği kalıcı olarak silmek istediğinize emin misiniz?')) return;

            const { error } = await dersverseSupabase
                .from('contents')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Silme hatası: ' + error.message);
            } else {
                loadAdminData();
            }
        }

        window.onload = async () => {
            const authorized = await checkAdminAuth();
            if (authorized) {
                loadAdminData();
            }
        };
    </script>
</body>
</html>
