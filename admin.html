<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DersVerse - Admin Yönetim Paneli</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --dersverse-bg: #0a0a12;
            --dersverse-card-bg: rgba(255, 255, 255, 0.05);
            --dersverse-border: rgba(255, 255, 255, 0.1);
            --dersverse-primary: #6366f1;
            --dersverse-primary-hover: #4f46e5;
            --dersverse-success: #10b981;
            --dersverse-danger: #ef4444;
            --dersverse-warning: #f59e0b;
            --dersverse-text: #f3f4f6;
            --dersverse-text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dersverse-bg);
            color: var(--dersverse-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header.admin-header {
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--dersverse-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .admin-badge {
            background: rgba(239, 68, 68, 0.2);
            color: var(--dersverse-danger);
            border: 1px solid rgba(239, 68, 68, 0.4);
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .admin-nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background: var(--dersverse-primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover { background: var(--dersverse-primary-hover); }
        .btn-success { background: var(--dersverse-success); }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: var(--dersverse-danger); }
        .btn-danger:hover { background: #dc2626; }
        .btn-warning { background: var(--dersverse-warning); color: #000; }
        .btn-warning:hover { background: #d97706; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--dersverse-border);
            color: var(--dersverse-text);
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.1); }

        main.admin-container {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-info h4 {
            color: var(--dersverse-text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .stat-info div {
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-icon {
            font-size: 2.5rem;
            opacity: 0.8;
        }

        .admin-section-box {
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--dersverse-text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--dersverse-border);
            font-size: 0.9rem;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--dersverse-text-muted);
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        tr:last-child td { border-bottom: none; }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-banned { background: rgba(239, 68, 68, 0.3); color: var(--dersverse-danger); border: 1px solid var(--dersverse-danger); }
        .role-teacher { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .role-student { background: rgba(99, 102, 241, 0.2); color: #818cf8; }

        .action-btns {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .announcement-form {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .announcement-input, .ban-input, .xp-input {
            flex-grow: 1;
            padding: 0.7rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--dersverse-border);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #12121f;
            border: 1px solid var(--dersverse-border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: var(--dersverse-primary);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .modal-body label {
            font-size: 0.85rem;
            color: var(--dersverse-text-muted);
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <a href="index.html" class="admin-logo">
            DersVerse
            <span class="admin-badge">Admin</span>
        </a>
        <div class="admin-nav-actions">
            <span style="color: var(--dersverse-text); font-size: 0.95rem; font-weight: 600;">Kadir Eymen Açıkoğlu</span>
            <a href="index.html" class="btn btn-outline">← Ana Siteye Dön</a>
        </div>
    </header>

    <main class="admin-container">
        <div class="admin-section-box">
            <h2 class="section-title">👥 Kullanıcı ve XP Yönetimi</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Ad Soyad / E-Posta</th>
                            <th>Rol</th>
                            <th>XP Puanı</th>
                            <th>Durum</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr><td colspan="5" style="text-align: center; color: var(--dersverse-text-muted); padding: 1.5rem;">Kullanıcılar yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- XP Modalı -->
    <div id="xp-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">⚡ Kullanıcıya XP Verme / Düzenleme</div>
            <div class="modal-body">
                <input type="hidden" id="xp-user-id">
                <input type="hidden" id="xp-current-val">
                <p id="xp-user-name" style="font-size: 0.9rem; font-weight: bold; color: #c084fc;"></p>
                <div>
                    <label>XP Miktarı:</label>
                    <input type="number" id="xp-amount" class="xp-input" placeholder="Örn: 500" style="width: 100%; margin-top: 0.4rem;">
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                <button class="btn btn-outline" onclick="closeXpModal()">İptal</button>
                <button class="btn btn-warning" onclick="submitAddXp(false)">Mevcut XP'ye Ekle</button>
                <button class="btn btn-success" onclick="submitAddXp(true)">Doğrudan Bu Yap</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        async function fetchUsers() {
            const tbody = document.getElementById('users-table-body');
            
            // Doğrudan Supabase profiles tablosundan çekiyoruz
            let { data, error } = await supabase.from('profiles').select('*');

            // IF-ELSE İLE HATA KONTROLÜ
            if (error) {
                console.error("Veritabanı hatası:", error.message);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--dersverse-danger); padding: 1.5rem;">Veriler çekilemedi: ${error.message}</td></tr>`;
                return;
            } else if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--dersverse-text-muted); padding: 1.5rem;">Tabloda henüz kayıtlı kullanıcı bulunmuyor.</td></tr>`;
                return;
            } else {
                // Veriler başarılı şekilde geldiysa tabloya yazdır
                tbody.innerHTML = data.map(u => {
                    const nameText = u.full_name || u.email || 'İsimsiz Kullanıcı';
                    const safeName = nameText.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const userId = u.id;
                    const currentXp = u.xp || 0;

                    return `
                    <tr>
                        <td><b>${nameText}</b><br><small style="color: var(--dersverse-text-muted);">${u.email || ''}</small></td>
                        <td><span class="status-badge ${u.role === 'teacher' ? 'role-teacher' : 'role-student'}">${u.role === 'teacher' ? 'Öğretmen' : 'Öğrenci'}</span></td>
                        <td style="color: #f59e0b; font-weight: bold;">⚡ ${currentXp} XP</td>
                        <td>${u.is_banned ? '<span class="status-badge status-banned">Engelli</span>' : '<span style="color: var(--dersverse-success);">Aktif</span>'}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-warning" onclick="openXpModal('${userId}', '${safeName}', ${currentXp})">⚡ XP Düzenle</button>
                            </div>
                        </td>
                    </tr>
                `;
                }).join('');
            }
        }

        // XP GÜNCELLEME İÇİN KULLANILAN IF-ELSE KOŞULLU BLOKLAR
        window.submitAddXp = async function(isOverwrite) {
            const userId = document.getElementById('xp-user-id').value;
            const currentXp = parseInt(document.getElementById('xp-current-val').value) || 0;
            const inputVal = parseInt(document.getElementById('xp-amount').value);

            // Koşullu kontrol blokları (İstediğin if-else yapısı)
            if (isNaN(inputVal)) {
                alert('Lütfen geçerli bir sayı girin.');
                return;
            } else if (inputVal < 0) {
                alert('Negatif bir değer girilemez.');
                return;
            } else {
                let newXp;

                // Ekleme mi yoksa doğrudan değiştirme mi yapılacağını if-else ile seçiyoruz
                if (isOverwrite === true) {
                    newXp = inputVal;
                } else {
                    newXp = currentXp + inputVal;
                }

                // Supabase veritabanına gönder
                const { error } = await supabase.from('profiles').update({ xp: newXp }).eq('id', userId);

                if (error) {
                    alert("Güncelleme başarısız: " + error.message);
                } else {
                    alert("XP başarıyla güncellendi!");
                    closeXpModal();
                    fetchUsers();
                }
            }
        }

        window.openXpModal = function(userId, userName, currentXp) {
            document.getElementById('xp-user-id').value = userId;
            document.getElementById('xp-current-val').value = currentXp;
            document.getElementById('xp-user-name').innerText = `Kullanıcı: ${userName} (Mevcut XP: ${currentXp})`;
            document.getElementById('xp-amount').value = '';
            document.getElementById('xp-modal').style.display = 'flex';
        }

        window.closeXpModal = function() {
            document.getElementById('xp-modal').style.display = 'none';
        }

        window.onload = () => {
            fetchUsers();
        };
    </script>
</body>
</html>
