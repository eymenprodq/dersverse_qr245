<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erişim Engellendi - DersVerse</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(239, 68, 68, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .ban-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .icon-box {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0;
        }

        .divider {
            width: 50px;
            height: 3px;
            background-color: var(--accent-color);
            margin: 20px auto;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="ban-container">
        <div class="icon-box">🚫</div>
        <h1>Erişim Engellendi</h1>
        <div class="divider"></div>
        <p>Platform kurallarına aykırı hareket edildiği veya güvenlik politikaları gereğince bu hesaba olan erişiminiz kalıcı olarak durdurulmuştur.</p>
    </div>

</body>
</html>
