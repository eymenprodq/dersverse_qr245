<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DersVerse - Giriş Yap / Kayıt Ol</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --dersverse-bg: #0a0a12;
            --dersverse-card-bg: rgba(255, 255, 255, 0.05);
            --dersverse-border: rgba(255, 255, 255, 0.1);
            --dersverse-primary: #6366f1;
            --dersverse-primary-hover: #4f46e5;
            --dersverse-text: #f3f4f6;
            --dersverse-text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dersverse-bg);
            color: var(--dersverse-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .auth-card {
            background: rgba(18, 18, 31, 0.95);
            border: 1px solid var(--dersverse-border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .auth-title {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--dersverse-text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--dersverse-text-muted);
        }

        .forgot-link {
            font-size: 0.8rem;
            color: var(--dersverse-primary);
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--dersverse-border);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--dersverse-primary);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: var(--dersverse-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--dersverse-primary-hover);
        }

        .btn-google {
            background: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 1rem;
        }

        .btn-google:hover {
            background: #f1f1f1;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--dersverse-text-muted);
            font-size: 0.8rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--dersverse-border);
        }

        .divider::before { margin-right: .5em; }
        .divider::after { margin-left: .5em; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--dersverse-text-muted);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            color: var(--dersverse-text);
        }

        /* Sıfırlama alanı varsayılan gizli */
        #resetSection {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-title">DersVerse</div>
        <div id="authSubtitle" class="auth-subtitle">Hesabınıza giriş yapın veya kayıt olun</div>

        <!-- Normal Giriş / Kayıt Formu -->
        <form id="loginForm" onsubmit="handleEmailAuth(event)">
            <div class="form-group">
                <label>E-Posta Adresi</label>
                <input type="email" id="email" required placeholder="ornek@mail.com">
            </div>
            <div class="form-group">
                <div class="form-label-wrapper">
                    <label>Şifre</label>
                    <a class="forgot-link" onclick="handleForgotPassword()">Şifremi Unuttum?</a>
                </div>
                <input type="password" id="password" required placeholder="******">
            </div>
            <button type="submit" class="btn btn-primary">Giriş Yap / Kayıt Ol</button>
        </form>

        <!-- Şifre Sıfırlama Bağlantısı ile Gelenler İçin Yeni Şifre Formu -->
        <form id="resetSection" onsubmit="handleNewPasswordSubmit(event)">
            <div class="form-group">
                <label>Yeni Şifreniz</label>
                <input type="password" id="newPassword" required placeholder="******" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">Şifreyi Güncelle</button>
        </form>

        <div id="googleDivider" class="divider">VEYA</div>

        <button id="googleBtn" type="button" class="btn btn-google" onclick="loginWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Google ile Giriş Yap
        </button>

        <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://dyxghgzquvsngehjjvcb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_qgcYdZz60VDBkfLZ3UVftw_G9o30nYd';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Ekranı "Yeni Şifre Oluştur" Moduna Geçiren Fonksiyon
        function showResetForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('googleDivider').style.display = 'none';
            document.getElementById('googleBtn').style.display = 'none';
            document.getElementById('resetSection').style.display = 'block';
            document.getElementById('authSubtitle').innerText = 'Yeni Şifrenizi Oluşturun';
        }

        // Supabase Kimlik Doğrulama Durumunu ve URL'i Dinleme
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                showResetForm();
            }
        });

        // Sayfa Yüklendiğinde URL Hash Kontrolü
        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash;
            if (hash.includes('type=recovery') || hash.includes('access_token')) {
                showResetForm();
            }
        });

        // Google ile Giriş Yönlendirmesi
        async function loginWithGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: 'https://dersverse-two.vercel.app/index.html'
                }
            });

            if (error) {
                alert("Google ile giriş yapılırken hata oluştu: " + error.message);
            }
        }

        // E-Posta / Şifre Giriş veya Otomatik Kayıt İşlemi
        async function handleEmailAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (signUpError) {
                    alert("Hata: " + signUpError.message);
                } else {
                    alert("Hesap oluşturuldu! Ana sayfaya yönlendiriliyorsunuz.");
                    window.location.href = "index.html";
                }
            } else {
                window.location.href = "index.html";
            }
        }

        // Şifre Sıfırlama E-Postası Gönderme
        async function handleForgotPassword() {
            const email = document.getElementById('email').value;

            if (!email) {
                alert("Lütfen önce e-posta adresinizi giriniz.");
                return;
            }

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: 'https://dersverse-two.vercel.app/login.html'
            });

            if (error) {
                alert("Hata: " + error.message);
            } else {
                alert("Şifre sıfırlama bağlantısı e-posta adresinize gönderildi. Lütfen gelen kutunuzu kontrol edin.");
            }
        }

        // Yeni Şifreyi Kaydetme İşlemi
        async function handleNewPasswordSubmit(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;

            const { error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                alert("Şifre güncellenirken bir hata oluştu: " + error.message);
            } else {
                alert("Şifreniz başarıyla güncellendi! Giriş yapabilirsiniz.");
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
