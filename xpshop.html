<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DersVerse XP Mağazası</title>
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --dersverse-bg: #0b0f19;
            --dersverse-card: #111827;
            --dersverse-text: #f3f4f6;
            --dersverse-text-muted: #9ca3af;
            --dersverse-border: #1f2937;
            --dersverse-primary: #6366f1;
            --dersverse-primary-hover: #4f46e5;
        }

        body.light-theme {
            --dersverse-bg: #f3f4f6;
            --dersverse-card: #ffffff;
            --dersverse-text: #1f2937;
            --dersverse-text-muted: #6b7280;
            --dersverse-border: #e5e7eb;
            --dersverse-primary: #4f46e5;
            --dersverse-primary-hover: #4338ca;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--dersverse-bg);
            color: var(--dersverse-text);
            padding: 20px;
            min-height: 100vh;
        }

        .dersverse-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--dersverse-card);
            padding: 20px 25px;
            border-radius: 16px;
            border: 1px solid var(--dersverse-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .shop-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .shop-nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dersverse-badge {
            background: rgba(99,102,241,0.15);
            padding: 6px 14px;
            border-radius: 9999px;
            color: var(--dersverse-primary);
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid var(--dersverse-border);
        }

        .dersverse-btn {
            background: var(--dersverse-primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .dersverse-btn:hover {
            background: var(--dersverse-primary-hover);
        }

        .dersverse-btn-outline {
            background: transparent;
            border: 1px solid var(--dersverse-border);
            color: var(--dersverse-text);
            box-shadow: none;
        }

        .dersverse-btn-outline:hover {
            background: var(--dersverse-border);
            color: var(--dersverse-primary);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        /* script.js içerisindeki dinamik kartlar için stil desteği */
        #shop-items-container > div {
            background: var(--dersverse-card) !important;
            border: 1px solid var(--dersverse-border) !important;
            border-radius: 14px !important;
            padding: 20px !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="dersverse-container">
        <!-- Üst Bilgi ve Navigasyon -->
        <div class="shop-header">
            <div>
                <h2>🚀 DersVerse Ultra XP Mağazası</h2>
                <p style="color: var(--dersverse-text-muted); font-size: 0.9rem;">250+ Eşsiz ürün, sandıklar, unvanlar ve auralar burada!</p>
            </div>
            <div class="shop-nav-right">
                <span class="dersverse-badge">💎 <span id="user-points">100</span> XP</span>
                <span id="user-badge" class="dersverse-badge">🔥 LGS Canavarı</span>
                <button id="dersverse-theme-toggle" class="dersverse-btn dersverse-btn-outline" onclick="dersverseToggleTheme()">☀️ Gündüz Modu</button>
            </div>
        </div>

        <div style="margin-bottom: 25px; display: flex; gap: 10px;">
            <a href="index.html" class="dersverse-btn dersverse-btn-outline" style="text-decoration: none; display: inline-flex; align-items: center;">← Ana Sayfaya Dön</a>
        </div>

        <!-- MAĞAZA ÜRÜNLERİNİN script.js TARAFINDAN OTOMATİK YÜKLENDİĞİ KRİTİK ALAN -->
        <div id="shop-items-container" class="shop-grid">
            <!-- script.js içerisindeki renderShop() burayı otomatik dolduracak -->
        </div>
    </div>

    <!-- Bağlı Olan script.js Dosyası ve Otomatik Tetikleyici -->
    <script src="script.js"></script>
    <script>
        // Sayfa yüklendiği an mağazanın ekrana basılmasını zorunlu kılan tetikleyici
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof renderShop === 'function') {
                renderShop();
            } else {
                console.error("renderShop fonksiyonu script.js içinde bulunamadı!");
            }
        });
    </script>
</body>
</html>
