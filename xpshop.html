<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DersVerse - Ultra Mağaza & Koleksiyon</title>
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #111827;
            --bg-card-hover: #1f2937;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --transition-speed: 0.3s;
        }

        .light-theme {
            --bg-main: #f3f4f6;
            --bg-card: #ffffff;
            --bg-card-hover: #f9fafb;
            --border-color: #e5e7eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent-glow: rgba(79, 70, 229, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .dersverse-header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .dersverse-container {
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dersverse-logo {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dersverse-nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dersverse-badge {
            background: var(--accent-glow);
            color: var(--primary);
            padding: 7px 16px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dersverse-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: transform 0.2s ease, background-color 0.2s ease;
            text-decoration: none;
        }

        .dersverse-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .dersverse-btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            box-shadow: none;
        }

        .dersverse-btn-outline:hover {
            background: var(--bg-card-hover);
            color: var(--primary);
            border-color: var(--primary);
        }

        main.dersverse-main-content {
            flex: 1;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .shop-header-section {
            margin-bottom: 35px;
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .shop-header-section h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .shop-header-section p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .dersverse-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        /* Özel Efekt Sınıfları (script.js ile uyumlu) */
        .neon-border { border: 2px solid #6366f1 !important; box-shadow: 0 0 15px rgba(99,102,241,0.5); }
        .fire-aura { border: 2px solid #ef4444 !important; box-shadow: 0 0 15px rgba(239,68,68,0.5); }
        .galaxy-bg { background: linear-gradient(135deg, #111827, #312e81) !important; }
        .lightning-aura { border: 2px solid #f59e0b !important; box-shadow: 0 0 15px rgba(245,158,11,0.5); }
    </style>
</head>
<body>

    <header class="dersverse-header">
        <div class="dersverse-container">
            <a href="index.html" class="dersverse-logo">
                🚀 DersVerse XP Mağazası
            </a>
            
            <div class="dersverse-nav-right">
                <span id="user-badge" class="dersverse-badge">🔥 LGS Canavarı</span>
                <span class="dersverse-badge">💎 <span id="user-points">100</span> XP</span>
                <button id="dersverse-theme-toggle" class="dersverse-btn dersverse-btn-outline" onclick="dersverseToggleTheme()">
                    ☀️ Gündüz Modu
                </button>
            </div>
        </div>
    </header>

    <main class="dersverse-main-content">
        <div style="margin-bottom: 25px;">
            <a href="index.html" class="dersverse-btn dersverse-btn-outline">
                ← Ana Sayfaya Dön
            </a>
        </div>

        <div class="shop-header-section">
            <h1>Ultra XP Mağazası & 250+ Eşsiz Öğe</h1>
            <p>Sandıklar açın, şans çarkını çevirin, unvanlar ve odak sesleri satın alarak DersVerse deneyiminizi zirveye taşıyın!</p>
        </div>

        <!-- Script.js içerisindeki renderShop buraya doğrudan çıktı basacak -->
        <div id="shop-items-container" class="dersverse-grid">
            <!-- Ürünler script.js tarafından otomatik yüklenecek -->
        </div>
    </main>

    <!-- Senin hazırladığın script.js dosyasını buraya bağlıyoruz -->
    <script src="script.js"></script>
</body>
</html>
