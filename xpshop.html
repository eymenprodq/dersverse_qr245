<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DersVerse - XP Mağazası ve Şans Çarkı</title>
    
    <!-- PWA / Favicon -->
    <link rel="icon" type="image/png" href="dersverse-logo-512x512.png">
    
    <!-- Harici CSS Tasarım Dosyası -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Üst Menü / Navigasyon Barı -->
    <header class="dersverse-header">
        <a href="index.html" class="dersverse-logo">DersVerse</a>
        
        <!-- Canlı Puan ve Rozet Alanı -->
        <div class="dersverse-user-stats">
            <span>⭐ Puanınız: <strong id="user-points">0</strong> XP</span>
            <span class="dersverse-badge" id="user-badge">🔥 Yükleniyor...</span>
        </div>

        <div class="dersverse-nav-actions">
            <button id="dersverse-theme-toggle" class="dersverse-btn dersverse-btn-outline" onclick="dersverseToggleTheme()">☀️ Gündüz Modu</button>
            <a href="index.html" class="dersverse-btn dersverse-btn-outline">🏠 Ana Sayfaya Dön</a>
        </div>
    </header>

    <!-- Mağaza Ana İçeriği -->
    <main class="dersverse-main" style="padding: 20px; max-width: 900px; margin: 0 auto;">
        <section class="dersverse-hero" style="text-align: center; margin-bottom: 20px;">
            <h1>🛒 DersVerse XP Mağazası ve Şans Çarkı</h1>
            <p>Sandıklar al, stokla, toplu satın al, şans çarkını çevir ve özel ayrıcalıklar kazan!</p>
        </section>

        <!-- Mağaza Ürünleri Konteyneri (script.js içerisindeki renderShop fonksiyonu burayı otomatik doldurur) -->
        <div id="shop-items-container" style="display: flex; flex-direction: column; gap: 10px;">
            <p style="text-align: center; color: #888;">Mağaza ürünleri yükleniyor...</p>
        </div>
    </main>

    <!-- Şans Çarkı / Kutu Açılım Animasyon Modali -->
    <div id="dersverse-wheel-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 99999;">
    </div>

    <!-- Harici JavaScript Dosyası -->
    <script src="script.js"></script>
</body>
</html>
