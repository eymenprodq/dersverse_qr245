<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="7HO7fMJQkkZRbFemkvJ7JASrZmYOfqoAglMJqsvDW9o" />
    <title>DersVerse - Tüm Derslerin Dijital Evreni</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --dersverse-bg: #0a0a12;
            --dersverse-card-bg: rgba(255, 255, 255, 0.05);
            --dersverse-border: rgba(255, 255, 255, 0.1);
            --dersverse-primary: #6366f1;
            --dersverse-primary-hover: #4f46e5;
            --dersverse-text: #f3f4f6;
            --dersverse-text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dersverse-bg);
            color: var(--dersverse-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        header.dersverse-header {
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--dersverse-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .dersverse-logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .dersverse-nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .dersverse-btn {
            background: var(--dersverse-primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .dersverse-btn:hover {
            background: var(--dersverse-primary-hover);
        }

        .dersverse-btn-outline {
            background: transparent;
            border: 1px solid var(--dersverse-border);
            color: var(--dersverse-text);
        }

        .dersverse-btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        main.dersverse-main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .dersverse-hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .dersverse-hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .dersverse-hero p {
            color: var(--dersverse-text-muted);
            font-size: 1.1rem;
        }

        /* Arama ve Filtre Kontrol Alanı */
        .dersverse-filter-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .dersverse-search-input {
            flex: 2;
            min-width: 220px;
            padding: 0.75rem 1rem;
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 8px;
            color: var(--dersverse-text);
            font-size: 0.95rem;
            outline: none;
        }

        .dersverse-search-input:focus {
            border-color: var(--dersverse-primary);
        }

        .dersverse-category-select {
            flex: 1;
            min-width: 160px;
            padding: 0.75rem 1rem;
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 8px;
            color: var(--dersverse-text);
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        .dersverse-category-select option {
            background: #12121f;
            color: var(--dersverse-text);
        }

        .dersverse-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .dersverse-card {
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dersverse-card-tag {
            font-size: 0.8rem;
            color: var(--dersverse-primary);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .dersverse-card-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .dersverse-card-desc {
            color: var(--dersverse-text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .dersverse-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .dersverse-modal-content {
            background: #12121f;
            border: 1px solid var(--dersverse-border);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
        }

        .dersverse-form-group {
            margin-bottom: 1rem;
        }

        .dersverse-form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--dersverse-text-muted);
        }

        .dersverse-form-group input, 
        .dersverse-form-group select, 
        .dersverse-form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--dersverse-border);
            border-radius: 6px;
            color: white;
        }
    </style>
</head>
<body>

    <header class="dersverse-header">
        <a href="#" class="dersverse-logo">DersVerse</a>
        <div class="dersverse-nav-actions">
            <button class="dersverse-btn dersverse-btn-outline" onclick="dersverseOpenModal()">İçerik Paylaş</button>
            <button class="dersverse-btn" id="dersverse-auth-btn" onclick="dersverseHandleAuth()">Kayıt Ol / Giriş Yap</button>
        </div>
    </header>

    <main class="dersverse-main">
        <section class="dersverse-hero">
            <h1>DersVerse Evrenine Hoş Geldiniz</h1>
            <p>Tüm ders notları ve dijital eğitim materyalleri tek bir çatı altında!</p>
        </section>

        <!-- Arama ve Filtreleme Alanı -->
        <div class="dersverse-filter-container">
            <input type="text" id="dersverse-search-input" class="dersverse-search-input" placeholder="İçerik veya ders adı ara..." oninput="dersverseFilterContents()">
            <select id="dersverse-category-filter" class="dersverse-category-select" onchange="dersverseFilterContents()">
                <option value="Tümü">Tüm Kategoriler</option>
                <option value="Matematik">Matematik</option>
                <option value="Fen Bilimleri">Fen Bilimleri</option>
                <option value="Türkçe">Türkçe</option>
                <option value="Sosyal Bilgiler">Sosyal Bilgiler</option>
                <option value="İngilizce">İngilizce</option>
                <option value="Kodlama & Teknoloji">Kodlama & Teknoloji</option>
            </select>
        </div>

        <div class="dersverse-grid" id="dersverse-content-grid">
            <!-- İçerikler Supabase'den Yüklenecek -->
        </div>
    </main>

    <!-- DersVerse İçerik Paylaşım Modalı -->
    <div class="dersverse-modal" id="dersverse-add-modal">
        <div class="dersverse-modal-content">
            <h2 style="margin-bottom: 1rem;">Yeni İçerik Paylaş</h2>
            <form id="dersverse-content-form" onsubmit="dersverseSubmitContent(event)">
                <div class="dersverse-form-group">
                    <label>Başlık</label>
                    <input type="text" id="dersverse-title" required placeholder="Örn: 7. Sınıf Matematik Notları">
                </div>
                <div class="dersverse-form-group">
                    <label>Ders / Kategori</label>
                    <select id="dersverse-category" required>
                        <option value="Matematik">Matematik</option>
                        <option value="Fen Bilimleri">Fen Bilimleri</option>
                        <option value="Türkçe">Türkçe</option>
                        <option value="Sosyal Bilgiler">Sosyal Bilgiler</option>
                        <option value="İngilizce">İngilizce</option>
                        <option value="Kodlama & Teknoloji">Kodlama & Teknoloji</option>
                    </select>
                </div>
                <div class="dersverse-form-group">
                    <label>Açıklama</label>
                    <textarea id="dersverse-description" rows="3" required placeholder="İçerik detayları..."></textarea>
                </div>
                <div class="dersverse-form-group">
                    <label>Bağlantı (Link / Google Drive)</label>
                    <input type="url" id="dersverse-link" required placeholder="https://...">
                </div>
                <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button type="button" class="dersverse-btn dersverse-btn-outline" onclick="dersverseCloseModal()">İptal</button>
                    <button type="submit" class="dersverse-btn">Gönder (Onaya Gider)</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tawk.to Canlı Destek Entegrasyonu -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6aaa9769d5bb1934472d59e2/1k2l5utmu';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>

    <script>
        // DersVerse - Supabase Bağlantı Yapılandırması
        const DERSVERSE_SUPABASE_URL = 'https://dyxghgzquvsngehjjvcb.supabase.co';
        const DERSVERSE_SUPABASE_KEY = 'sb_publishable_qgcYdZz60VDBkfLZ3UVftw_G9o30nYd'; 
        const dersverseSupabase = supabase.createClient(DERSVERSE_SUPABASE_URL, DERSVERSE_SUPABASE_KEY);

        let dersverseAllContents = [];

        // Kullanıcı Oturum Kontrolü
        async function dersverseCheckUser() {
            const { data: { user } } = await dersverseSupabase.auth.getUser();
            const authBtn = document.getElementById('dersverse-auth-btn');
            if (user) {
                authBtn.innerText = 'Çıkış Yap (' + user.email.split('@')[0] + ')';
            } else {
                authBtn.innerText = 'Kayıt Ol / Giriş Yap';
            }
            dersverseSetupProtection(user);
        }

        // Geliştirici Kısıtlamaları (Admin Hariç Koruma)
        function dersverseSetupProtection(user) {
            const isAdmin = user && user.email === 'femememe1973@gmail.com';
            if (isAdmin) return;

            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.key === 'F12' || 
                    (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) ||
                    (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key))) {
                    e.preventDefault();
                    return false;
                }
            });
        }

        // Giriş/Çıkış Yönlendirme Mantığı
        async function dersverseHandleAuth() {
            const { data: { user } } = await dersverseSupabase.auth.getUser();
            if (user) {
                await dersverseSupabase.auth.signOut();
                window.location.reload();
            } else {
                window.location.href = "login.html";
            }
        }

        function dersverseOpenModal() { document.getElementById('dersverse-add-modal').style.display = 'flex'; }
        function dersverseCloseModal() { document.getElementById('dersverse-add-modal').style.display = 'none'; }

        // Onaylanmış İçerikleri Yükleme
        async function dersverseLoadContents() {
            const { data, error } = await dersverseSupabase
                .from('contents')
                .select('*')
                .eq('status', 'approved');

            if (error) {
                console.error("Veri yüklenirken hata:", error);
                return;
            }

            dersverseAllContents = data || [];
            dersverseRenderContents(dersverseAllContents);
        }

        // İçerik Kartlarını Ekrana Basma
        function dersverseRenderContents(contents) {
            const grid = document.getElementById('dersverse-content-grid');

            if (!contents || contents.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--dersverse-text-muted);">Aradığınız kriterlere uygun içerik bulunamadı.</p>';
                return;
            }

            grid.innerHTML = contents.map(item => `
                <div class="dersverse-card">
                    <div>
                        <div class="dersverse-card-tag">${escapeHtml(item.category || 'Genel')}</div>
                        <h3 class="dersverse-card-title">${escapeHtml(item.title)}</h3>
                        <p class="dersverse-card-desc">${escapeHtml(item.description)}</p>
                    </div>
                    <a href="detay.html?id=${item.id}" class="dersverse-btn dersverse-btn-outline" style="text-align: center; text-decoration: none;">Detayları Gör</a>
                </div>
            `).join('');
        }

        // Arama ve Kategori Filtreleme Mantığı
        function dersverseFilterContents() {
            const searchVal = document.getElementById('dersverse-search-input').value.toLowerCase();
            const categoryVal = document.getElementById('dersverse-category-filter').value;

            const filtered = dersverseAllContents.filter(item => {
                const titleMatch = item.title && item.title.toLowerCase().includes(searchVal);
                const descMatch = item.description && item.description.toLowerCase().includes(searchVal);
                const matchesSearch = titleMatch || descMatch;

                const matchesCategory = categoryVal === 'Tümü' || item.category === categoryVal;

                return matchesSearch && matchesCategory;
            });

            dersverseRenderContents(filtered);
        }

        // Veritabanına Yeni İçerik Ekleme
        async function dersverseSubmitContent(e) {
            e.preventDefault();
            const { data: { user } } = await dersverseSupabase.auth.getUser();

            if (!user) {
                alert('İçerik paylaşabilmek için lütfen giriş yapınız.');
                window.location.href = "login.html";
                return;
            }

            const title = document.getElementById('dersverse-title').value;
            const category = document.getElementById('dersverse-category').value;
            const description = document.getElementById('dersverse-description').value;
            const link = document.getElementById('dersverse-link').value;

            const { error } = await dersverseSupabase.from('contents').insert([{
                title,
                category,
                description,
                link,
                user_id: user.id,
                status: 'pending'
            }]);

            if (error) {
                alert('Hata: ' + error.message);
            } else {
                alert('İçeriğiniz başarıyla iletildi. Yönetici onayından sonra yayınlanacaktır.');
                dersverseCloseModal();
                document.getElementById('dersverse-content-form').reset();
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = () => {
            dersverseCheckUser();
            dersverseLoadContents();
        };
    </script>
</body>
</html>
