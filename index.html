<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="7HO7fMJQkkZRbFemkvJ7JASrZmYOfqoAglMJqsvDW9o" />
    <title>DersVerse - Tüm Derslerin Dijital Evreni</title>
    
    <!-- PWA / APK Manifest ve Logo Entegrasyonu -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="dersverse-logo-512x512.png">
    <link rel="apple-touch-icon" href="dersverse-logo-512x512.png">

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --dersverse-bg: #0a0a12;
            --dersverse-card-bg: rgba(255, 255, 255, 0.05);
            --dersverse-border: rgba(255, 255, 255, 0.1);
            --dersverse-primary: #6366f1;
            --dersverse-primary-hover: #4f46e5;
            --dersverse-text: #f3f4f6;
            --dersverse-text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dersverse-bg);
            color: var(--dersverse-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        header.dersverse-header {
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--dersverse-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .dersverse-logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .dersverse-nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .dersverse-btn {
            background: var(--dersverse-primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .dersverse-btn:hover {
            background: var(--dersverse-primary-hover);
        }

        .dersverse-btn-outline {
            background: transparent;
            border: 1px solid var(--dersverse-border);
            color: var(--dersverse-text);
        }

        .dersverse-btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .dersverse-btn-apk {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .dersverse-btn-apk:hover {
            background: linear-gradient(135deg, #059669, #047857);
        }

        main.dersverse-main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .dersverse-hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .dersverse-hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .dersverse-hero p {
            color: var(--dersverse-text-muted);
            font-size: 1.1rem;
        }

        .dersverse-filter-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .dersverse-search-input {
            flex: 2;
            min-width: 220px;
            padding: 0.75rem 1rem;
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 8px;
            color: var(--dersverse-text);
            font-size: 0.95rem;
            outline: none;
        }

        .dersverse-search-input:focus {
            border-color: var(--dersverse-primary);
        }

        .dersverse-category-select {
            flex: 1;
            min-width: 160px;
            padding: 0.75rem 1rem;
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 8px;
            color: var(--dersverse-text);
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        .dersverse-category-select option {
            background: #12121f;
            color: var(--dersverse-text);
        }

        .dersverse-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .dersverse-card {
            background: var(--dersverse-card-bg);
            border: 1px solid var(--dersverse-border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dersverse-card-tag {
            font-size: 0.8rem;
            color: var(--dersverse-primary);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .dersverse-card-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .dersverse-card-desc {
            color: var(--dersverse-text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        /* Embed / Iframe Alanı Kart İçinde */
        .dersverse-embed-box {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-top: 1rem;
        }

        .dersverse-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .dersverse-modal-content {
            background: #12121f;
            border: 1px solid var(--dersverse-border);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .dersverse-form-group {
            margin-bottom: 1rem;
        }

        .dersverse-form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--dersverse-text-muted);
        }

        .dersverse-form-group input, 
        .dersverse-form-group select, 
        .dersverse-form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--dersverse-border);
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .dersverse-form-group input:focus, .dersverse-form-group textarea:focus {
            border-color: var(--dersverse-primary);
        }

        .dersverse-divider {
            text-align: center;
            margin: 15px 0;
            color: var(--dersverse-text-muted);
            font-size: 0.85rem;
            border-top: 1px dashed var(--dersverse-border);
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <header class="dersverse-header">
        <a href="#" class="dersverse-logo">DersVerse</a>
        <div class="dersverse-nav-actions">
            <a href="https://dersverse.vercel.app/DersVerse.apk" download class="dersverse-btn dersverse-btn-apk">
                📱 APK İndir
            </a>
            <button class="dersverse-btn dersverse-btn-outline" onclick="dersverseOpenModal()">İçerik Paylaş</button>
            <button class="dersverse-btn" id="dersverse-auth-btn" onclick="dersverseHandleAuth()">Kayıt Ol / Giriş Yap</button>
        </div>
    </header>

    <main class="dersverse-main">
        <section class="dersverse-hero">
            <h1>DersVerse Evrenine Hoş Geldiniz</h1>
            <p>Tüm ders notları, e-kitaplar ve interaktif materyaller tek bir çatı altında!</p>
        </section>

        <!-- Arama ve Filtreleme Alanı -->
        <div class="dersverse-filter-container">
            <input type="text" id="dersverse-search-input" class="dersverse-search-input" placeholder="İçerik veya ders adı ara..." oninput="dersverseFilterContents()">
            <select id="dersverse-category-filter" class="dersverse-category-select" onchange="dersverseFilterContents()">
                <option value="Tümü">Tüm Kategoriler</option>
                <option value="Matematik">Matematik</option>
                <option value="Fen Bilimleri">Fen Bilimleri</option>
                <option value="Türkçe">Türkçe</option>
                <option value="Sosyal Bilgiler">Sosyal Bilgiler</option>
                <option value="İngilizce">İngilizce</option>
                <option value="Kodlama & Teknoloji">Kodlama & Teknoloji</option>
            </select>
        </div>

        <div class="dersverse-grid" id="dersverse-content-grid">
            <!-- İçerikler Supabase'den Dinamik Yüklenecek -->
        </div>
    </main>

    <!-- DersVerse Akıllı İçerik Paylaşım Modalı -->
    <div class="dersverse-modal" id="dersverse-add-modal">
        <div class="dersverse-modal-content">
            <h2 style="margin-bottom: 1rem;">Yeni Materyal Paylaş</h2>
            <form id="dersverse-content-form" onsubmit="dersverseSubmitContent(event)">
                <div class="dersverse-form-group">
                    <label>Başlık</label>
                    <input type="text" id="dersverse-title" required placeholder="Örn: 8. Sınıf Matematik Zirveye Adım Adım">
                </div>
                <div class="dersverse-form-group">
                    <label>Ders / Kategori</label>
                    <select id="dersverse-category" required>
                        <option value="Matematik">Matematik</option>
                        <option value="Fen Bilimleri">Fen Bilimleri</option>
                        <option value="Türkçe">Türkçe</option>
                        <option value="Sosyal Bilgiler">Sosyal Bilgiler</option>
                        <option value="İngilizce">İngilizce</option>
                        <option value="Kodlama & Teknoloji">Kodlama & Teknoloji</option>
                    </select>
                </div>
                <div class="dersverse-form-group">
                    <label>Açıklama / Notlar</label>
                    <textarea id="dersverse-description" rows="2" required placeholder="Materyal hakkında kısa bilgi..."></textarea>
                </div>
                
                <!-- AKILLI EMBED / LİNK GİRİŞ ALANI (FlipHTML5, YouTube, Iframe vb.) -->
                <div class="dersverse-form-group" style="background: rgba(99, 102, 241, 0.1); padding: 12px; border-radius: 8px; border: 1px dashed var(--dersverse-primary);">
                    <label style="color: white; font-weight: bold;">🔗 Akıllı Embed / FlipHTML5 / YouTube / Iframe Linki</label>
                    <input type="text" id="dersverse-embed-input" placeholder="Örn: https://online.fliphtml5.com/muvvt/etqw/ veya iframe kodu yapıştır" style="margin-top: 5px;">
                    <small style="color: var(--dersverse-text-muted); display: block; margin-top: 4px;">Buraya yapıştırdığınız bağlantı otomatik olarak e-kitap veya video oynatıcıya dönüştürülür!</small>
                </div>

                <div class="dersverse-divider">VEYA STANDART DOSYA YÜKLE</div>

                <div class="dersverse-form-group">
                    <label>Dosya Seç (PDF vb.)</label>
                    <input type="file" id="dersverse-file-upload" accept=".pdf,.html,.mp4,.zip">
                </div>

                <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 15px;">
                    <button type="button" class="dersverse-btn dersverse-btn-outline" onclick="dersverseCloseModal()">İptal</button>
                    <button type="submit" id="submit-content-btn" class="dersverse-btn">Paylaş ve Yayınla</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Entegrasyon Mantığı -->
    <script>
        // Supabase Bağlantı Bilgilerinizi Buraya Ekleyin
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allContents = [];

        // Sayfa Yüklendiğinde İçerikleri Çek
        window.addEventListener('DOMContentLoaded', () => {
            dersverseFetchContents();
        });

        function dersverseOpenModal() {
            document.getElementById('dersverse-add-modal').style.display = 'flex';
        }

        function dersverseCloseModal() {
            document.getElementById('dersverse-add-modal').style.display = 'none';
        }

        // Akıllı Link & Embed Ayrıştırma Fonksiyonu
        function parseEmbedInput(rawInput) {
            let embedUrl = null;
            let postType = 'text';

            if (!rawInput) return { embedUrl, postType };

            // 1. Iframe kodu mu?
            if (rawInput.includes('<iframe') && rawInput.includes('src=')) {
                const srcMatch = rawInput.match(/src=["']([^"']+)["']/);
                if (srcMatch && srcMatch[1]) {
                    embedUrl = srcMatch[1];
                    postType = 'embed';
                }
            } 
            else {
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                const matches = rawInput.match(urlRegex);

                if (matches && matches.length > 0) {
                    const foundUrl = matches[0];
                    
                    // FlipHTML5
                    if (foundUrl.includes('fliphtml5.com')) {
                        embedUrl = foundUrl;
                        postType = 'embed_flipbook';
                    } 
                    // YouTube
                    else if (foundUrl.includes('youtube.com') || foundUrl.includes('youtu.be')) {
                        let videoId = '';
                        if (foundUrl.includes('youtu.be')) {
                            videoId = foundUrl.split('/').pop().split('?')[0];
                        } else {
                            const urlParams = new URLSearchParams(foundUrl.split('?')[1]);
                            videoId = urlParams.get('v');
                        }
                        embedUrl = `https://www.youtube.com/embed/${videoId}`;
                        postType = 'embed_video';
                    }
                    // Diğer Harici Linkler / Embedler
                    else {
                        embedUrl = foundUrl;
                        postType = 'embed';
                    }
                }
            }
            return { embedUrl, postType };
        }

        // İçerik Listeleme ve Supabase'den Çekme
        async function dersverseFetchContents() {
            try {
                const { data, error } = await supabase
                    .from('contents')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allContents = data || [];
                dersverseRenderContents(allContents);
            } catch (err) {
                console.error("Veri çekme hatası:", err.message);
            }
        }

        // Grid Üzerinde Kartları Oluşturma
        dersverseRenderContents(contentsList) {
            const gridEl = document.getElementById('dersverse-content-grid');
            gridEl.innerHTML = '';

            if (contentsList.length === 0) {
                gridEl.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--dersverse-text-muted);">Henüz içerik paylaşılmamış.</p>`;
                return;
            }

            contentsList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'dersverse-card';

                let embedHtml = '';
                if (item.embed_url) {
                    if (item.post_type === 'embed_flipbook' || item.embed_url.includes('fliphtml5')) {
                        // FlipHTML5 için reklamsız maskelenmiş yükseklik
                        embedHtml = `
                            <div class="dersverse-embed-box" style="height: 450px;">
                                <iframe src="${item.embed_url}" style="width: 100%; height: 100%; border: none;" allowfullscreen="true" scrolling="no"></iframe>
                            </div>
                        `;
                    } else if (item.post_type === 'embed_video' || item.embed_url.includes('youtube')) {
                        // YouTube için 16:9 oran
                        embedHtml = `
                            <div class="dersverse-embed-box" style="position: relative; paddingTop: 56.25%;">
                                <iframe src="${item.embed_url}" style="position: absolute; top:0; left:0; width:100%; height:100%; border:none;" allowfullscreen></iframe>
                            </div>
                        `;
                    } else {
                        // Genel Embed
                        embedHtml = `
                            <div class="dersverse-embed-box" style="height: 350px;">
                                <iframe src="${item.embed_url}" style="width: 100%; height: 100%; border: none;" allowfullscreen></iframe>
                            </div>
                        `;
                    }
                }

                card.innerHTML = `
                    <div>
                        <div class="dersverse-card-tag">${item.category || 'Genel'}</div>
                        <h3 class="dersverse-card-title">${item.title}</h3>
                        <p class="dersverse-card-desc">${item.description || ''}</p>
                        ${embedHtml}
                    </div>
                    ${item.download_url ? `<a href="${item.download_url}" target="_blank" class="dersverse-btn" style="margin-top: 1rem; justify-content: center;">📥 Dosyayı İndir / Aç</a>` : ''}
                `;
                gridEl.appendChild(card);
            });
        }

        // Yeni İçerik Kaydetme Form İşlemi
        async function dersverseSubmitContent(e) {
            e.preventDefault();
            
            const title = document.getElementById('dersverse-title').value;
            const category = document.getElementById('dersverse-category').value;
            const description = document.getElementById('dersverse-description').value;
            const embedInputVal = document.getElementById('dersverse-embed-input').value;
            
            const { embedUrl, postType } = parseEmbedInput(embedInputVal);

            const newContent = {
                title,
                category,
                description,
                embed_url: embedUrl,
                post_type: postType,
                download_url: null
            };

            try {
                const { error } = await supabase.from('contents').insert([newContent]);
                if (error) throw error;

                alert("İçerik başarıyla paylaşıldı!");
                dersverseCloseModal();
                document.getElementById('dersverse-content-form').reset();
                dersverseFetchContents();
            } catch (err) {
                alert("Paylaşım hatası: " + err.message);
            }
        }

        // Arama ve Kategoriye Göre Filtreleme
        function dersverseFilterContents() {
            const query = document.getElementById('dersverse-search-input').value.toLowerCase();
            const selectedCategory = document.getElementById('dersverse-category-filter').value;

            const filtered = allContents.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(query) || (item.description && item.description.toLowerCase().includes(query));
                const matchesCategory = selectedCategory === 'Tümü' || item.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            dersverseRenderContents(filtered);
        }

        function dersverseHandleAuth() {
            alert("Kayıt ol / Giriş yap sistemi yakında aktifleşecek!");
        }
    </script>
</body>
</html>
