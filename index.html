<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DersVerse - Tüm Derslerin Dijital Evreni</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0a0a12;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none; /* Metin seçimini engeller */
        }

        header {
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .categories {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .category-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }

        .category-btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-tag {
            font-size: 0.8rem;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        /* Modal Stilleri */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #12121f;
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">DersVerse</a>
        <div class="nav-actions">
            <button class="btn btn-outline" id="add-content-btn" onclick="openModal()">İçerik Paylaş</button>
            <button class="btn" id="auth-btn" onclick="handleAuth()">Google ile Giriş Yap</button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>DersVerse Evrenine Hoş Geldiniz</h1>
            <p>Matematik, Fen, Türkçe, Sosyal, İngilizce ve Kodlama ders notları ve materyalleri!</p>
        </section>

        <div class="categories">
            <button class="category-btn active">Tümü</button>
            <button class="category-btn">Matematik</button>
            <button class="category-btn">Fen Bilimleri</button>
            <button class="category-btn">Türkçe</button>
            <button class="category-btn">Sosyal Bilgiler</button>
            <button class="category-btn">İngilizce</button>
            <button class="category-btn">Kodlama & Teknoloji</button>
        </div>

        <div class="grid" id="content-grid">
            <!-- Onaylı içerikler Supabase veritabanından çekilir -->
        </div>
    </main>

    <!-- İçerik Gönderme Modalı -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 1rem;">Yeni İçerik Paylaş</h2>
            <form id="content-form" onsubmit="submitContent(event)">
                <div class="form-group">
                    <label>Başlık</label>
                    <input type="text" id="title" required placeholder="Örn: 7. Sınıf Matematik Notları">
                </div>
                <div class="form-group">
                    <label>Ders / Kategori</label>
                    <select id="category" required>
                        <option value="Matematik">Matematik</option>
                        <option value="Fen Bilimleri">Fen Bilimleri</option>
                        <option value="Türkçe">Türkçe</option>
                        <option value="Sosyal Bilgiler">Sosyal Bilgiler</option>
                        <option value="İngilizce">İngilizce</option>
                        <option value="Kodlama & Teknoloji">Kodlama & Teknoloji</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Açıklama</label>
                    <textarea id="description" rows="3" required placeholder="İçerik detayları..."></textarea>
                </div>
                <div class="form-group">
                    <label>Bağlantı (Google Drive / Link)</label>
                    <input type="url" id="link" required placeholder="https://...">
                </div>
                <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">İptal</button>
                    <button type="submit" class="btn">Gönder (Onaya Gider)</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Supabase Bağlantı Yapılandırması
        const SUPABASE_URL = 'https://dyxghgzquvsngehjjvcb.supabase.co';
        const SUPABASE_ANON_KEY = 'BURAYA_SUPABASE_ANON_KEY_GELECEK'; // Supabase > Project Settings > API kısmındaki anon public key
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Kullanıcı Oturum Kontrolü
        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            const authBtn = document.getElementById('auth-btn');
            if (user) {
                authBtn.innerText = 'Çıkış Yap (' + user.email.split('@')[0] + ')';
            } else {
                authBtn.innerText = 'Google ile Giriş Yap';
            }
            setupDevToolsProtection(user);
        }

        // Ön Yüz Geliştirici Kısıtlamaları (Admin Olmayanlar İçin)
        function setupDevToolsProtection(user) {
            const isAdmin = user && user.email === 'femememe1973@gmail.com';
            if (isAdmin) return;

            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.key === 'F12' || 
                    (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) ||
                    (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key))) {
                    e.preventDefault();
                    return false;
                }
            });
        }

        // Auth İşlemleri
        async function handleAuth() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                await supabase.auth.signOut();
                window.location.reload();
            } else {
                await supabase.auth.signInWithOAuth({ provider: 'google' });
            }
        }

        function openModal() { document.getElementById('add-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('add-modal').style.display = 'none'; }

        // İçerik Listeleme (Yalnızca Onaylanmışlar)
        async function loadContents() {
            const grid = document.getElementById('content-grid');
            const { data, error } = await supabase
                .from('contents')
                .select('*')
                .eq('status', 'approved');

            if (error || !data || data.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Henüz yayınlanmış bir içerik bulunmuyor.</p>';
                return;
            }

            grid.innerHTML = data.map(item => `
                <div class="card">
                    <div>
                        <div class="card-tag">${item.category || 'Genel'}</div>
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.description}</p>
                    </div>
                    <a href="${item.link}" target="_blank" class="btn btn-outline" style="text-align: center; text-decoration: none;">İncele / İndir</a>
                </div>
            `).join('');
        }

        // Veritabanına İçerik Gönderme
        async function submitContent(e) {
            e.preventDefault();
            const { data: { user } } = await supabase.auth.getUser();

            if (!user) {
                alert('İçerik paylaşabilmek için lütfen Google hesabınızla giriş yapınız.');
                return;
            }

            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;
            const link = document.getElementById('link').value;

            const { error } = await supabase.from('contents').insert([{
                title,
                category,
                description,
                link,
                user_id: user.id,
                status: 'pending'
            }]);

            if (error) {
                alert('Hata: ' + error.message);
            } else {
                alert('İçeriğiniz başarıyla iletildi. Yönetici onayından sonra yayınlanacaktır.');
                closeModal();
                document.getElementById('content-form').reset();
            }
        }

        window.onload = () => {
            checkUser();
            loadContents();
        };
    </script>
</body>
</html>
